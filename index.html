<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Git na Prática</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="img/githubs.png" alt="Logo Git" class="imagem-canto">
    <h1 class="titulo">Git na Prática: Comandos e Conflitos</h1>
    <img src="img/capivara.png" alt="Capivara" class="imagem-canto">
  </header>

  <section class="comandos">
    <h2>Resumo de comandos principais</h2>
    <div class="caixa-comandos">
      <ul>
        <li><code>git init</code> — iniciar repositório</li>
        <li><code>git status</code> — verificar estado do repositório</li>
        <li><code>git add .</code> — adicionar tudo à staging</li>
        <li><code>git commit -m "mensagem"</code> — salvar alteração</li>
        <li><code>git push</code> — enviar alterações</li>
      </ul>
    </div>
  </section>
</body>
</html>
